<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos Guardados</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f4f4; color: #333; }
        header { background: #fff; border-bottom: 1px solid #ccc; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: bold; font-size: 1.2rem; border: 1px solid #ccc; padding: 5px 10px; }
        nav a { text-decoration: none; color: #333; margin-left: 15px; border: 1px solid #ccc; padding: 5px 10px; font-size: 0.9rem; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; background: #fff; border: 1px solid #ccc; padding: 30px; min-height: 300px; }
        h2 { text-align: center; margin-bottom: 30px; font-size: 1.2rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 2px solid #000; padding: 12px; text-align: left; font-size: 0.9rem; }
        th { font-weight: bold; text-transform: uppercase; }
        footer { text-align: center; margin: 40px 0 20px 0; font-size: 0.8rem; }
        .social-icons { display: flex; justify-content: center; gap: 10px; margin-bottom: 5px; }
        .icon { width: 25px; height: 25px; border: 1px solid #333; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.7rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo">LOGO</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="#">Servicios</a>
            <a href="contacts.html">Contacts</a>
            <a href="#">Login</a>
        </nav>
    </header>

    <div class="container">
        <h2>Contactos</h2>
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Celular</th>
                </tr>
            </thead>
            <tbody id="tablaContactos">
                <!-- Los datos del localStorage se cargarán aquí dinámicamente -->
            </tbody>
        </table>
    </div>

    <footer>
        <div class="social-icons">
            <div class="icon">fb</div>
            <div class="icon">tw</div>
            <div class="icon">ins</div>
        </div>
        <div>NOMBRE COMPLETO</div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
